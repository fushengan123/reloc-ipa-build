name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iphoneos app
        run: |
          xcodebuild build \
            -project Reloc.xcodeproj \
            -scheme Reloc \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Reloc.app build/Payload/
          (cd build && zip -qry Reloc.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reloc-unsigned-IPA
          path: build/Reloc.ipa
          if-no-files-found: error

name: Build Reloc-ready IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp build identity
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          SHORT="$(date -u +%m%d-%H%M)"
          echo "build stamp: ${STAMP} / icon label: Reloc ${SHORT}"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          sed -i '' "s|RelocBuildStamp: \"dev-local\"|RelocBuildStamp: \"${STAMP}\"|" project.yml
          # Put the build label on the home screen so the installed build is
          # identifiable without opening the app.
          sed -i '' "s|CFBundleDisplayName: Reloc|CFBundleDisplayName: Reloc ${SHORT}|" project.yml
          grep -n "RelocBuildStamp\|CFBundleDisplayName" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iphoneos app
        run: |
          xcodebuild build \
            -project Reloc.xcodeproj \
            -scheme Reloc \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Reloc.app build/Payload/
          (cd build && zip -qry Reloc-ready.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reloc-ready-${{ env.STAMP }}
          path: build/Reloc-ready.ipa
          if-no-files-found: error
